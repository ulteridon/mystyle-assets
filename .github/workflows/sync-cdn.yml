# Publishes Patra's content to Cloudflare Pages (https://patra-content.pages.dev) on every push to main.
# The admin site keeps committing here as before; this runs after each commit.
#
# A Pages deploy switches over all at once, so phones never see a list that names
# an image the CDN doesn't have yet. Only new or changed files are uploaded.
#
# Needs, in Settings -> Secrets and variables -> Actions -> Secrets:
#   CLOUDFLARE_API_TOKEN  (permission: Account / Cloudflare Pages / Edit)
#   CLOUDFLARE_ACCOUNT_ID
# Until both exist the job skips itself, so pushing this file is harmless.

name: Sync content to CDN

on:
  push:
    branches: [main]
    paths:
      - "all_images/**"
      - "*.json"
      - "scripts/**"
      - ".github/workflows/sync-cdn.yml"
  workflow_dispatch: {}

# Admin saves can land seconds apart. Each run publishes everything, so runs queue instead of overlapping.
concurrency:
  group: cdn-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: patra-content
  WRANGLER: wrangler@4.149.0

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet - skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Build the site folder
        if: steps.setup.outputs.ready == 'true'
        run: |
          pip install "pillow==12.3.0"
          python scripts/build_cdn_site.py --out site

      - name: Create the Pages project (first run only)
        if: steps.setup.outputs.ready == 'true'
        run: |
          if ! npx --yes "$WRANGLER" pages project list | grep -q "$PAGES_PROJECT"; then
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch main
          fi

      - name: Publish
        if: steps.setup.outputs.ready == 'true'
        run: >
          npx --yes "$WRANGLER" pages deploy site
          --project-name "$PAGES_PROJECT" --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "content ${GITHUB_SHA::7}"

      - name: Check the CDN serves the new files
        if: steps.setup.outputs.ready == 'true'
        run: |
          base="https://$PAGES_PROJECT.pages.dev"
          fail=0
          for f in app_config.json manifest.json; do
            if curl -sf "$base/$f?check=$GITHUB_RUN_ID" | cmp -s - "$f"; then echo "$f matches"; else echo "$f DIFFERS or missing"; fail=1; fi
          done
          img=$(ls all_images | tail -1)
          for p in "all_images/$img" "thumbs/$img"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/$p")
            echo "$p -> $code"; [ "$code" = 200 ] || fail=1
          done
          curl -sI "$base/all_images/$img" | grep -i -E "^(cache-control|content-type):"
          exit $fail
